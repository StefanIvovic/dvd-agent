<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DVD Rental Agent</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
  :root { --ink:#1c2430; --muted:#6b7686; --line:#dfe3e8; --accent:#0b5cad; --bg:#f7f8fa; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width: 960px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
  form { display:flex; gap:8px; }
  textarea { flex:1; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:6px; resize:vertical; min-height:46px; }
  button { font:inherit; padding:0 18px; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:18px 20px; margin-top:20px; }
  .q { font-weight:600; margin-bottom:8px; }
  .meta { color:var(--muted); font-size:12px; margin-top:12px; }
  .src { font-size:13px; border-top:1px solid var(--line); margin-top:14px; padding-top:10px; }
  .src > div { margin:8px 0; }
  .src code.id { color:var(--accent); }
  details { font-size:12px; color:var(--muted); margin-top:8px; }
  pre { white-space:pre-wrap; background:var(--bg); padding:8px; border-radius:4px; font-size:12px; }
  .rowswrap { max-height:420px; overflow:auto; margin-top:4px; }
  table.rows { border-collapse:collapse; font-size:12px; margin-top:4px; }
  table.rows td, table.rows th { border:1px solid var(--line); padding:2px 6px; text-align:left; }
  .status { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; margin-bottom:8px; }
  .status.not_found { background:#fdecea; color:#a32018; }
  .status.partial { background:#fff4e0; color:#8a5a00; }
  .status.answered { background:#e8f3ec; color:#1e6b3a; }
</style>
</head>
<body>
<main>
  <h1>DVD Rental Agent</h1>
  <p class="sub"><span id="stats">Loading…</span> · after a long list, ask “page 2”, “pages 2, 3” or “20 per page” ·
    <a href="#" id="new">new conversation</a></p>
  <form id="f">
    <textarea id="q" placeholder="e.g. Which film category brought in the most revenue in April 2007?" required></textarea>
    <button id="b">Ask</button>
  </form>
  <div id="out"></div>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => DOMPurify.sanitize(marked.parse(s));
// a result is one page of rows (all of them when it fits on one page)
const table = (cols, rows) => `<div class="rowswrap"><table class="rows"><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr>` +
  rows.map(r => `<tr>${cols.map(c => `<td>${esc(r[c])}</td>`).join("")}</tr>`).join("") + `</table></div>`;
const pageInfo = c => c.pages > 1 ? ` · page ${c.page} of ${c.pages} (${c.page_size} per page)` : "";
let conversation = null;   // sent back with each question, so "page 2" refers to the last list
document.getElementById("new").onclick = e => { e.preventDefault(); conversation = null;
  document.getElementById("out").innerHTML = ""; };
fetch("/stats").then(r => r.json()).then(s => {
  document.getElementById("stats").textContent = `${s.films} films · ${s.with_embedding} embedded for search` +
    (s.stale ? ` · ${s.stale} changed, re-embedding` : "");
});
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim(), b = document.getElementById("b");
  b.disabled = true; b.textContent = "Thinking…";
  const card = document.createElement("div"); card.className = "card";
  card.innerHTML = `<div class="q">${esc(q)}</div><div class="a">Working (local model, this can take a minute)…</div>`;
  document.getElementById("out").prepend(card);
  try {
    const r = await fetch("/ask", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({question:q, conversation_id:conversation})});
    const d = await r.json();
    if (!r.ok) throw new Error(JSON.stringify(d));
    conversation = d.conversation_id;
    const srcs = d.citations.map(c => c.type === "sql"
      ? `<div><code class="id">[${c.id}]</code> ${c.row_count} rows${pageInfo(c)}<pre>${esc(c.sql)}</pre>${table(c.columns, c.rows)}</div>`
      : `<div><code class="id">[${c.id}]</code> film ${c.film_id} · ${esc(c.title)} — ${esc(c.description)}</div>`).join("");
    const steps = d.steps.map(s => `${s.node} ${s.seconds}s`).join(" → ");
    const label = {answered: "answered", partial: "partly answered", not_found: "not in the data"}[d.status] || d.status;
    card.querySelector(".a").innerHTML = `<span class="status ${d.status}">${label}</span>` + md(d.answer) +
      (srcs ? `<div class="src">${srcs}</div>` : "") +
      `<div class="meta">${steps}${d.trace_id ? ` · MLflow trace ${esc(d.trace_id)}` : ""}</div>` +
      `<details><summary>all SQL attempts, plan, self-check</summary><pre>${esc(JSON.stringify(
        {sql: d.sql.map(s => s.error ? {sql: s.sql, error: s.error} : {sql: s.sql, rows: s.row_count}),
         plan: d.plan, assessment: d.assessment}, null, 2))}</pre></details>`;
  } catch (err) {
    card.querySelector(".a").textContent = "Error: " + err.message;
  } finally { b.disabled = false; b.textContent = "Ask"; }
};
</script>
</body>
</html>
